# Render Blueprint - "Did That Trade Really Happen?" (Capstone Review 2, PW26_SSS_08)
# The app is at the repository root. Free plan; the service sleeps when idle and wakes on the first request (~1 min).
services:
  - type: web
    name: did-that-trade-really-happen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CAPSTONE_MODE
        value: hosted
      - key: PYTHONUTF8
        value: "1"
